<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Product Stack: the tools, services and AI tooling behind Stunt Double">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#e5487a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e5487a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="0.5" stop-color="#e5487a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>
    <rect y="334" width="1200" height="6" fill="url(#accent)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#9aa4b2" font-size="18" font-weight="600" letter-spacing="3">STUNT DOUBLE</text>
    <text x="62" y="166" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1.5">Product Stack</text>
    <text x="64" y="212" fill="#c7cdd6" font-size="24">The tools, services, models and integrations we build and run on.</text>
    <g font-size="15" font-weight="600">
      <g transform="translate(64 254)">
        <rect width="128" height="34" rx="17" fill="#6d5dfc" fill-opacity="0.18" stroke="#6d5dfc" stroke-opacity="0.6"/>
        <text x="64" y="22" fill="#c9c3ff" text-anchor="middle">Engineering</text>
      </g>
      <g transform="translate(204 254)">
        <rect width="92" height="34" rx="17" fill="#e5487a" fill-opacity="0.18" stroke="#e5487a" stroke-opacity="0.6"/>
        <text x="46" y="22" fill="#ffc2d4" text-anchor="middle">Design</text>
      </g>
      <g transform="translate(308 254)">
        <rect width="128" height="34" rx="17" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.6"/>
        <text x="64" y="22" fill="#ffdca3" text-anchor="middle">LLM Models</text>
      </g>
      <g transform="translate(448 254)">
        <rect width="146" height="34" rx="17" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
        <text x="73" y="22" fill="#a7f3d0" text-anchor="middle">AI and Agents</text>
      </g>
      <g transform="translate(606 254)">
        <rect width="134" height="34" rx="17" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="67" y="22" fill="#bae6fd" text-anchor="middle">Claude Code</text>
      </g>
      <g transform="translate(752 254)">
        <rect width="132" height="34" rx="17" fill="#a3a3a3" fill-opacity="0.15" stroke="#a3a3a3" stroke-opacity="0.5"/>
        <text x="66" y="22" fill="#e5e5e5" text-anchor="middle">Open Source</text>
      </g>
    </g>
  </g>
</svg>
